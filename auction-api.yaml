          description: 아이템 카테고리
        - name: item_name
          in: query
          required: false
          schema:
            type: string
          description: 아이템 이름
          example: 롱 소드
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: 페이징 처리를 위한 cursor<br>- 최초 조회 시 빈값으로 요청<br>- 응답 값으로 받은 next_cursor를 사용하여 다음 500개의 거래 내역 리스트를 조회
          example: 1a0fba40cfe6e653f508887de45b5624
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionHistory'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
