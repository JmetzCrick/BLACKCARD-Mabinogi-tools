  /mabinogi/v1/auction/keyword-search:
    get:
      tags:
        - Auction
      summary: 경매장 매물 키워드 검색
      description: 현재 경매장에서 판매 중인 매물에 대한 키워드 검색
      operationId: mabinogi_get_keyword_search
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          description: |
            아이템 검색어
            - 검색어는 string 내 단어 별 쉼표(,)로 구분하여 최소 1개, 최대 10개 입력이 가능합니다.
            - 검색어는 한글, 영문, 숫자만 사용 가능하며, 쉼표를 제외한 특수 문자 및 공백 등을 입력 시 쉼표로 치환되어 검색됩니다.
            - 이름에 검색어가 모두 포함된 아이템을 조회합니다.<br> e.g. keyword="숏,소드"로 조회 시 "숏 소드", "배틀 숏 소드", "모험가의 플루트 숏 소드" 등이 조회됩니다.
            - 검색어로 입력된 단어와 아이템 이름에 포함된 단어가 정확히 일치하는 경우만 조회됩니다.<br> e.g. keyword="모험가,소드"로 조회 시, "모험가의 플루트 숏 소드"는 조회되지 않습니다.
          example: 숏,소드
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: 페이징 처리를 위한 cursor<br>- 최초 조회 시 빈값으로 요청<br>- 응답 값으로 받은 next_cursor를 사용하여 다음 매물 리스트를 조회<br>- 1회 조회 시 최대 500개 매물 리스트 응답
          example: 1a0fba40cfe6e653f508887de45b5624
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionItem'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

components:
  schemas:
    AuctionItem:
      type: object
      properties:
        auction_item:
          type: array
          description: 현재 판매중인 아이템 목록
          items:
            type: object
            properties:
              item_name:
                type: string
                description: 해당 아이템의 이름
              item_display_name:
                type: string
                description: 아이템 전체 이름
              item_count:
                type: integer
                format: int64
                description: 해당 아이템의 판매 수량
              auction_item_category:
                type: string
                description: 해당 아이템의 카테고리
              auction_price_per_unit:
                type: integer
                format: int64
                description: 해당 아이템의 개당 판매 가격
              date_auction_expire:
                type: string
                example: "2024-09-01T08:28:35Z"
                description: 만료 기한 (해당 아이템의 판매가 종료되는 일시) (UTC0)
              item_option:
                type: array
                items:
                  type: object
                  properties:
                    option_type:
                      type: string
                      description: 아이템 옵션 유형
                    option_sub_type:
                      type: string
                      description: 아이템 옵션 하위 유형
                    option_value:
                      type: string
                      description: 아이템 옵션 값
                    option_value2:
                      type: string
                      description: 아이템 옵션 값 2
                    option_desc:
                      type: string
                      description: 아이템 옵션 부가 정보
        next_cursor:
          type: string
          description: 다음 페이지 조회용 Cursor(null 일 경우 다음 페이지 없음)
    AuctionHistory:
      type: object
      properties:
        auction_history:
            type: array
            description: 거래 목록
            items:
              type: object
              properties:
                item_name:
                  type: string
                  description: 해당 아이템의 이름
                item_display_name:
                  type: string
                  description: 아이템 전체 이름
                item_count:
                  type: integer
                  format: int64
                  description: 해당 아이템의 거래 수량
                auction_item_category:
                  type: string
                  description: 해당 아이템의 카테고리
                auction_price_per_unit:
                  type: integer
                  format: int64
                  description: 해당 아이템의 개당 판매 가격
                date_auction_buy:
                  type: string
                  example: "2024-09-01T08:28:350Z"
                  description: 해당 아이템이 거래된 일시 (UTC0)
                auction_buy_id:
                  type: string
                  description: 해당 아이템의 거래 식별 정보
                item_option:
                  type: array
                  items:
                    type: object
                    properties:
                      option_type:
                        type: string
                        description: 아이템 옵션 유형
                      option_sub_type:
                        type: string
                        description: 아이템 옵션 하위 유형
                      option_value:
                        type: string
                        description: 아이템 옵션 값
                      option_value2:
                        type: string
                        description: 아이템 옵션 값 2
                      option_desc:
                        type: string
                        description: 아이템 옵션 부가 정보
        next_cursor:
          type: string
          description: 다음 페이지 조회용 Cursor(null 일 경우 다음 페이지 없음)
    ErrorMessage:
      type: object
      properties:
        error:
          type: object
          properties:
            name:
              type: string
              description: 에러 명
              example: string
            message:
              type: string
              description: 에러 설명
              example: string
