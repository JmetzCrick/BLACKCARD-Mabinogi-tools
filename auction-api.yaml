openapi: 3.0.3
info:
  title: 마비노기 API
  version: 1.0.0
  contact:
    name: help_openapi@nexon.co.kr
  description: |-
    - 마비노기의 게임 데이터는 평균 10분 후 확인 가능합니다.
    - 반짝이는 색상의 코드 정보는 제공되지 않습니다.
    - 각 인챈트 스크롤 아이템은 "인챈트 스크롤"로 검색 후 아이템 세부 옵션의 option_value에서 인챈트 스크롤 종류를 확인하실 수 있습니다.

servers:
  - url: 'https://open.api.nexon.com'

tags:
  - name: Auction
    description: 경매장 매물 검색 및 거래 내역 조회

paths:
  /mabinogi/v1/auction/list:
    get:
      tags:
        - Auction
      summary: 경매장 매물 검색
      description: 현재 경매장에서 판매중인 매물 리스트 조회
      operationId: mabinogi_get_auction_list
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: auction_item_category
          in: query
          required: false
          schema:
            type: string
            enum:
              - 개조석
              - 검
              - 경갑옷
              - 기타
              - 기타 소모품
              - 기타 스크롤
              - 기타 장비
              - 기타 재료
              - 꼬리
              - 날개
              - 낭만농장/달빛섬
              - 너클
              - 던전 통행증
              - 도끼
              - 도면
              - 둔기
              - 듀얼건
              - 랜스
              - 로브
              - 마기그래프
              - 마기그래프 도안
              - 마도서
              - 마리오네트
              - 마법가루
              - 마비노벨
              - 마족 스크롤
              - 말풍선 스티커
              - 매직 크래프트
              - 모자/가발
              - 방패
              - 변신 메달
              - 보석
              - 분양 메달
              - 불타래
              - 뷰티 쿠폰
              - 생활 도구
              - 석궁
              - 수리검
              - 스케치
              - 스태프
              - 신발
              - 실린더
              - 아틀라틀
              - 악기
              - 알반 훈련석
              - 액세서리
              - 양손 장비
              - 얼굴 장식
              - 에이도스
              - 에코스톤
              - 염색 앰플
              - 오브
              - 옷본
              - 원거리 소모품
              - 원드
              - 음식
              - 의자/사물
              - 인챈트 스크롤
              - 장갑
              - 제련/블랙스미스
              - 제스처
              - 주머니
              - 중갑옷
              - 책
              - 천옷
              - 천옷/방직
              - 체인 블레이드
              - 토템
              - 팔리아스 유물
              - 퍼퓸
              - 페이지
              - 포션
              - 피니 펫
              - 핀즈비즈
              - 한손 장비
              - 핸들
              - 허브
              - 활
              - 힐웬 공학
          description: 아이템 카테고리
        - name: item_name
          in: query
          required: false
          schema:
            type: string
          description: 아이템 이름
          example: 롱 소드
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: 페이징 처리를 위한 cursor<br>- 최초 조회 시 빈값으로 요청<br>- 응답 값으로 받은 next_cursor를 사용하여 다음 500개의 매물 리스트를 조회
          example: 1a0fba40cfe6e653f508887de45b5624
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionItem'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /mabinogi/v1/auction/history:
    get:
      tags:
        - Auction
      summary: 경매장 거래 내역 조회
      description: 경매장에서 아이템이 판매된 내역 조회 <br> 최근 1시간 데이터 제공
      operationId: mabinogi_get_auction_history
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
        - name: auction_item_category
          in: query
          required: false
          schema:
            type: string
            enum:
              - 개조석
              - 검
              - 경갑옷
              - 기타
              - 기타 소모품
              - 기타 스크롤
              - 기타 장비
              - 기타 재료
              - 꼬리
              - 날개
              - 낭만농장/달빛섬
              - 너클
              - 던전 통행증
              - 도끼
